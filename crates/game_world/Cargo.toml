[package]
name = "game_world"
version = "0.1.0"
edition = "2024"

[lib]
name = "game_world"
path = "src/lib.rs"

[dependencies.game_core]
path = "../game_core"

[dependencies.bevy]
version = "0.18.1"
default-features = false
features = [
    "bevy_log",
    "bevy_asset",
    "bevy_pbr"
]

[dependencies.bevy_rapier3d]
version = "0.33.0"
default-features = false
features = ["dim3"]

[dependencies.fastnoise-lite]
version = "1.1.1"

[dependencies.lz4_flex]
version = "0.11.5"

[dependencies.futures-lite]
version = "2.6.1"

[dependencies.bincode]
version = "2.0.1"
default-features = false
features = ["alloc"]
